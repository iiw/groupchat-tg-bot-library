[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "groupchat-tg-bot"
version = "0.1.0"
description = "A small library for Telegram group-chat AI bots (OpenAI-compatible LLMs), extended with modules"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.6",
    "openai>=1.40",
]

[project.optional-dependencies]
vision = ["Pillow>=10.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "Pillow>=10.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/groupchat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
